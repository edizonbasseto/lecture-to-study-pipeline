name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    # The gitleaks CLI is used directly: the gitleaks action scans
    # `<first-commit>^..HEAD`, which fails on a repository whose first
    # pushed commit is its root.
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  denylist-scan:
    # The denylist is a repository secret, never a committed file: committing
    # it would publish the terms it protects. The scanner reports line
    # numbers only, so a match never echoes a term into the log.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history against the private denylist
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "The DENYLIST repository secret is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          git -c core.quotePath=false log -p --all --diff-merges=separate \
            --text --no-ext-diff --no-textconv --no-color \
            --format='%an%n%ae%n%cn%n%ce%n%B' > "$RUNNER_TEMP/history.txt"
          git for-each-ref \
            --format='%(refname)%0a%(tag)%0a%(taggername) %(taggeremail)%0a%(contents)' \
            >> "$RUNNER_TEMP/history.txt"
          python3 -I scripts/denylist_scan.py "$RUNNER_TEMP/denylist.txt" \
            < "$RUNNER_TEMP/history.txt"

  test:
    # macOS is required: OCR uses Apple Vision (pyobjc) and TTS uses MLX.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the media, typesetting, and secret-scanning tools the tests exercise
        run: brew install ffmpeg typst poppler gitleaks
      - run: uv sync --group dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q -rs
